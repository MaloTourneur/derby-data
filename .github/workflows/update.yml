name: update derby.json
on:
  schedule:
    - cron: "50 4,10,16,22 * * *"  # 10 min before the devices wake (Paris winter time)
  workflow_dispatch:                 # "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - run: |
          git config user.name "derby-bot"
          git config user.email "derby-bot@users.noreply.github.com"
          git add derby.json
          git diff --cached --quiet || (git commit -m "derby.json update" && git push)
